name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run security:audit
      - run: npm run test:detection-e2e
      - run: npm run test:release-e2e
      - run: npm run release:verify

  real-depth-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke

  real-airsketch-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:airsketch-models
        env:
          AIRSKETCH_HAND_P95_MAX_MS: 250
          AIRSKETCH_CAPTURE_P95_MAX_MS: 60
          AIRSKETCH_PIPELINE_P95_MAX_MS: 350
      - run: npm run test:airsketch-quality

  detection-benchmark:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run benchmark:detection
      - name: Upload detection benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-benchmark-${{ runner.os }}-${{ runner.arch }}
          path: tests/.benchmark-results/detection-benchmark-latest.json
          if-no-files-found: warn
          retention-days: 30
